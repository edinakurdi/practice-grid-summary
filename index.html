    <section>

        <h2>Defining Columns & Rows</h2>

        <div class="card-grid">

            <div class="card">
                <h3>grid-template-columns</h3>

                <p>
                    Sets column widths.
                </p>

                <pre>
                    grid-template-columns:
                    200px 1fr 1fr;
                </pre>

            </div>


            <div class="card">

                <h3>fr unit</h3>

                <p>
                    Remaining space divided into fractions
                </p>
                <pre>
                    1fr 2fr 1fr
                </pre>

            </div>

        </div>

    </section>
